stages:
  - build
  - deploy

# Build the project
build:
  stage: build
  image: node:18
  script:
    - npm ci
    - npm run build -- --emptyOutDir
  artifacts:
    paths:
      - dist/    # Make sure to include the trailing slash
    expire_in: 1 week

# Deploy the build artifacts
deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - build    # Use 'needs' instead of 'dependencies' (more modern syntax)
  before_script:
    - apk add --no-cache openssh
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  script:
    - ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "cd /home/dev/client && git pull origin staging && npm install"
    # Remove the build step from remote server since we're copying our local build
    - ls -la dist/  # Debug: List contents of dist directory
    - scp -r dist/* $SSH_USER@$SSH_HOST:/var/www/client
  only:
    - staging


