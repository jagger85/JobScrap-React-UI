stages:
  - build
  - deploy

build:
  stage: build
  image: node:18
  script:
    - npm ci
    - npm run build
    - echo "Build output contents:"
    - ls -la dist
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

deploy:
  stage: deploy
  image: alpine:latest
  needs:
    - build
  before_script:
    - apk add --no-cache openssh git
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
  script:
    # First, pull the latest changes on the remote server
    - ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "cd /var/www/client && git pull origin master"
    
    # Ensure the target directory exists and is empty
    - ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST "mkdir -p /var/www/client && rm -rf /var/www/client/*"
    
    # Then copy the files
    - scp -r dist/* $SSH_USER@$SSH_HOST:/var/www/client/
  only:
    - staging



