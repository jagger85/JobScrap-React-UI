# .gitlab-ci.yml
stages:
  - build
  - deploy

# Build the project
build:
  stage: build
  image: node:18 # Node.js version image
  script:
    - npm ci # Install dependencies cleanly
    - npm run build -- --emptyOutDir # Build the Vite React app
  artifacts:
    paths:
      - dist # Store the build artifacts
    expire_in: 1 week # Retain build files for a week

# Deploy the build artifacts to the remote Linux machine
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh  # Install SSH
  script:
    - eval $(ssh-agent -s)  # Start SSH agent
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | echo pwd | ssh-add home/dev/.ssh/gitlabkey  # Add SSH private key
    - mkdir -p ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts  # Setup known hosts
    - ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST 
      "bash -l -c 'cd client && git pull origin staging && npm install && npm run build -- --emptyOutDir'"
    - scp -r dist/* $SSH_USER@$SSH_HOST:/var/www/client  # Copy files to server
  only:
    - staging  # Deploy only when pushing to the staging branch
